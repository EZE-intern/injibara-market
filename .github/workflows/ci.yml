name: CI Pipeline


on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop


jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Check Formatting
        run: npx prettier --check .
        
      - name: Run ESLint
        run: npm run lint

  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Check Server Types
        run: npx tsc --project server/tsconfig.json --noEmit
        
      - name: Check Client Types
        run: npx tsc --project client/tsconfig.json --noEmit
