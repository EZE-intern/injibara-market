name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: cd client && npm install
      - run: cd server && npm install
      - run: npm run lint

  test:
    name: Run Tests
    needs: lint # This ensures tests ONLY run if linting passes first
    runs-on: ubuntu-latest

    # This spins up an isolated PostgreSQL database just for the CI tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: injibara_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: cd client && npm install

      - name: Install Server Dependencies
        run: cd server && npm install

      - name: Run Frontend Tests (Vitest)
        run: cd client && npm test

      - name: Run Backend Tests (Jest)
        env:
          # This connects Prisma directly to the CI PostgreSQL container
          DATABASE_URL: postgresql://root:password@localhost:5432/injibara_test_db?schema=public
        run: cd server && npm test

  build:
      name: Build Project
      needs: test # Only runs if tests pass
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
        - name: Install Root Dependencies
          run: npm ci
        - name: Install Client Dependencies
          run: cd client && npm ci
        - name: Install Server Dependencies
          run: cd server && npm install
        - name: Build Frontend
          run: cd client && npm run build
        - name: Build Backend
          run: cd server && npm run build

  docker-build:
      name: Docker Build
      needs: build # Only runs if code compiles successfully
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Build API Docker Image
          run: docker build -f docker/api.Dockerfile -t injibara-api .
