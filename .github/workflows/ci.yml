name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: injibara_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Run Backend Tests (Vitest)
        env:
          DATABASE_URL: mysql://root:password@127.0.0.1:3306/injibara_test_db
          DATABASE_URL_MYSQL: mysql://root:password@127.0.0.1:3306/injibara_test_db
          JWT_SECRET: MIKAEL_ARTETA_ARSENAL
        run: cd server && npm test

  build:
      name: Build Project
      needs: test
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
        - name: Install Dependencies
          run: npm ci
        - name: Generate Prisma Client
          run: cd server && npx prisma generate
        - name: Build Frontend
          run: cd client && npm run build
        - name: Build Backend
          run: cd server && npm run build

  docker-build:
      name: Docker Build
      needs: build # Only runs if code compiles successfully
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Build API Docker Image
          run: docker build -f docker/api.Dockerfile -t injibara-api .
